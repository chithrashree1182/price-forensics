[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price-forensics"
version = "0.4.0"
description = "Measuring discount integrity in Indian e-commerce"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
analysis = ["scipy>=1.11"]
ml = ["scikit-learn>=1.4", "ruptures>=1.1", "scipy>=1.11"]
export = ["pyarrow>=15.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
pf = "priceforensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
